name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/*, feat/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run E2E Test Suite
        run: node test_e2e.ts

      - name: Run AKCA Security & Penetration Suite
        run: node test_security.ts
